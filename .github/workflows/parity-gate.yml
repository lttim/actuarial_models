name: parity-gate

# Dedicated, fast-fail status check for the parity suite. Branch protection
# requires this to be green before any PR can merge to main. Keep it lean:
# parity tests + the static Excel validator are the only invariants that
# absolutely cannot regress.
#
# Always-on policy (P0 hardening, 2026-04): this workflow runs on EVERY PR
# regardless of which paths changed. Path filters were removed because new
# product builders (e.g. ``build_<newproduct>_excel_workbook.py``) would
# otherwise silently bypass the gate until someone remembered to update the
# trigger glob. The job is also listed in
# ``.github/branch-protection.json`` as a required status check.

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: parity-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: parity + validator (ubuntu / py3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: annuity_model
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.lock -r requirements-dev.txt
      - name: Install LibreOffice (runtime Excel recalc gate)
        # Powers tests/parity/test_runtime_excel_recalc.py via
        # excel_runtime_recalc.py. ~250 MB install but cached on the runner
        # image. See docs/runbooks/runtime_excel_recalc_gate.md.
        run: sudo apt-get update && sudo apt-get install -y libreoffice-calc
      - name: Parity tests (fast-fail, verbose)
        run: pytest tests/parity/ -x -v --tb=short
      - name: Static Excel formula validator (export + validate every product)
        run: pytest tests/test_excel_export_validation.py -x -v --tb=short
      - name: Deep smoke (real workbook build + validate)
        run: python scripts/deep_smoke.py
