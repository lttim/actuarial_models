name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Cancel in-progress runs for the same ref so a fast follow-up push doesn't
# pile up CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit (lint + format + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Need full history so the parity_constants <-> model_change_log
          # guard can diff against the PR's true base SHA.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime + dev deps
        run: |
          pip install --upgrade pip
          pip install -r annuity_model/requirements.lock -r annuity_model/requirements-dev.txt pre-commit
      - name: Run pre-commit on all files
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Enforce parity_constants <-> model_change_log discipline
        # Mechanical enforcement of the rule documented in CONTRIBUTING.md
        # and parity_test_checklist.md: any change to parity_constants.py
        # must be accompanied by an entry in model_change_log.md so reviewers
        # can verify the justification and parity trace.
        if: github.event_name == 'pull_request'
        run: |
          python annuity_model/scripts/check_parity_constants_changelog.py \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"
      - name: Enforce behavior-change test discipline
        if: github.event_name == 'pull_request'
        run: |
          python annuity_model/scripts/check_test_update_required.py \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"
      - name: Enforce Team Run Packet evidence
        if: github.event_name == 'pull_request'
        run: |
          python annuity_model/scripts/check_team_run_packet_evidence.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --github-event-path "$GITHUB_EVENT_PATH"

  test:
    name: tests (${{ matrix.os }} / py${{ matrix.python-version }})
    needs: pre-commit
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: annuity_model
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.lock -r requirements-dev.txt coverage[toml]
      - name: pytest with coverage
        # The coverage gate is a one-way ratchet. The floor lives in
        # annuity_model/pyproject.toml under [tool.coverage.report].fail_under
        # and is enforced by scripts/ratchet_coverage.py so the threshold
        # has a single source of truth (no more workflow vs. pyproject drift).
        # See the script's docstring for how to bump the floor in a follow-up
        # PR after improving coverage.
        run: |
          coverage run -m pytest tests/ tests/parity/ -q
          coverage report
          python scripts/ratchet_coverage.py --coverage-cmd python -m coverage
          coverage xml -o coverage.xml
      - name: Parity contract docs in sync with parity_constants
        run: python scripts/render_parity_contract.py --check
      - name: Deep smoke (build + validate every product workbook)
        run: python scripts/deep_smoke.py
      - name: Launcher self-check (POSIX only -- the Finder double-click path)
        if: runner.os != 'Windows'
        shell: bash
        # Run with a stripped PATH so we exercise the same fallback logic a
        # Finder double-click hits. The launcher must locate ./.venv/bin/python
        # *or* a >= requires-python interpreter on PATH.
        run: |
          python -m venv .venv
          ./.venv/bin/python -m pip install --upgrade pip
          ./.venv/bin/python -m pip install -r requirements.lock
          env -i HOME="$HOME" PATH="/usr/bin:/bin:/usr/sbin:/sbin" SHELL=/bin/bash \
            bash ./run_pricing_ui.sh --self-check
      - name: Launcher self-check (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          py -3 -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -r requirements.lock
          call run_pricing_ui.bat --self-check
      - name: HTML pytest report
        if: always()
        run: |
          mkdir -p reports
          pytest tests/ tests/parity/ -q --html=reports/pytest_report.html --self-contained-html || true
      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-report-${{ matrix.os }}-py${{ matrix.python-version }}
          path: annuity_model/reports/pytest_report.html
      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: annuity_model/coverage.xml

  docker:
    name: docker build + deep_smoke in container
    needs: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        # The Dockerfile pins python:3.12-slim-bookworm by digest. If this step
        # fails with "manifest unknown" the digest in the FROM line is stale --
        # refresh it via Docker Hub registry API and update both Dockerfile and
        # this comment. Build context is the repo root because the Dockerfile
        # COPYs from annuity_model/ and actuarial_parity_kit/.
        run: docker build -t annuity-model:ci .
      - name: Smoke (deep_smoke inside container)
        # The default CMD is `python scripts/deep_smoke.py`, but make the
        # invocation explicit so a future CMD change does not silently change
        # what CI verifies.
        run: docker run --rm annuity-model:ci python scripts/deep_smoke.py
      - name: Parity tests inside container
        # Belt-and-braces: also run the parity gate from inside the image so
        # we catch the case where dev-deps installed but the runtime image is
        # missing something the parity tests need.
        run: docker run --rm annuity-model:ci python -m pytest tests/parity -q
