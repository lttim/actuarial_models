name: docs

on:
  push:
    branches: [main]
    paths:
      - "annuity_model/docs/**"
      - "annuity_model/README.md"
      - "annuity_model/mkdocs.yml"
      - "annuity_model/src/annuity_model/parity_constants.py"
      - "annuity_model/scripts/render_parity_contract.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: annuity_model
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install docs dependencies
        # Pin to requirements.lock so docs builds are reproducible and don't
        # break when a transitive dep on PyPI publishes a tighter constraint
        # (e.g. contourpy 1.2.0 backtrack vs numpy==2.4.4 lock).
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-dev.txt
          pip install --no-build-isolation -e .

      - name: Verify tolerance docs are in sync with parity_constants
        run: python scripts/render_parity_contract.py --check

      - name: Build mkdocs site
        run: mkdocs build --strict

      # `enablement: true` makes configure-pages auto-enable Pages on the
      # repo on first run -- without this, the action fails with
      # "Get Pages site failed ... Not Found" until someone manually flips
      # Settings -> Pages -> Source = "GitHub Actions".
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: annuity_model/site

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    if: github.ref == 'refs/heads/main'
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
