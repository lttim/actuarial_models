site_name: annuity_model
site_description: SPIA / Term Life / RILA pricing engine, ALM ladder, and Excel workbook generator.
site_author: lttim
repo_url: https://github.com/lttim/actuarial_models
repo_name: actuarial_models
edit_uri: edit/main/annuity_model/

docs_dir: docs
site_dir: site

validation:
  nav:
    omitted_files: ignore
  links:
    not_found: ignore
    unrecognized_links: ignore

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            heading_level: 2
            members_order: source
            show_signature_annotations: true
            separate_signature: true

nav:
  # NOTE: paths here are relative to docs_dir (i.e. annuity_model/docs/), so they
  # MUST NOT include the `docs/` prefix. The repo's root README and the ui/
  # MIGRATION doc live outside docs_dir; they're surfaced as repo links from
  # the Home / Architecture pages instead of being mounted into the site nav.
  - Home: index.md
  - Glossary: glossary.md
  - Contracts:
      - SPIA / ALM: model_parity_contract.md
      - RILA: rila_parity_contract.md
      - RILA spec: rila_product_spec.md
      - Release checklist: parity_test_checklist.md
  - Runbooks:
      - Investigate parity break: runbooks/investigate_parity_break.md
      - Debug validator failure: runbooks/debug_validator_failure.md
      - Regenerate Excel cache: runbooks/regenerate_excel_cache.md
      - Launcher double-click: runbooks/launcher_double_click.md
      - Release: runbooks/release.md
  - Governance:
      - CHANGELOG: CHANGELOG.md
      - Model change log: model_change_log.md
      - CODEOWNERS rationale: CODEOWNERS_RATIONALE.md
