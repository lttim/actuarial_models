# pyproject.toml -- annuity_model
#
# Chunk 3 (2026-05): standard src/ layout. Runtime code lives under
# `src/annuity_model`; tests and scripts import it through the package name.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Single source of truth for the minimum supported Python version.
# Mirrored by:
#   - annuity_model/run_pricing_ui.sh   (MIN_PYTHON_MAJOR/MINOR)
#   - annuity_model/run_pricing_ui.bat  (MIN_PY_MAJOR/MINOR)
#   - .github/workflows/ci.yml          (matrix.python-version)
#   - tools below (target-version)
# tests/test_launcher_invariants.py asserts these stay in sync.
name = "annuity_model"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.4.6",
    "pandas==3.0.3",
    "pyarrow==23.0.1",
    "altair==6.2.1",
    "streamlit==1.58.0",
    "matplotlib==3.11.0",
    "openpyxl==3.1.5",
    "defusedxml==0.7.1",
]

[project.optional-dependencies]
dev = [
    "setuptools==80.9.0",
    "wheel==0.47.0",
    "pytest==9.1.0",
    "pytest-html==4.2.0",
    "ruff==0.15.17",
    "mypy==1.20.1",
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.6",
    "mkdocstrings[python]==1.0.4",
    "pymdown-extensions==10.21.3",
    "hypothesis==6.155.2",
    "pytest-benchmark==5.2.3",
    "pytest-cov==7.1.0",
    "mutmut==3.6.0",
    "pip-audit==2.10.1",
    "bandit==1.9.4",
]

[project.scripts]
annuity-portfolio = "annuity_model.cli:main"
annuity-pricing-ui = "annuity_model.launchers:pricing_ui"
annuity-test-dashboard = "annuity_model.launchers:test_dashboard"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
annuity_model = ["data/**/*.csv", "data/**/*.json", "data/**/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]
extend-exclude = [
    ".venv",
    ".smoke",
    "reports",
    "model output",
    "streamlit output",
    "*.xlsx",
]

[tool.ruff.lint]
# Curated rule set: errors, warnings, pyflakes, isort, bugbear, simplify,
# comprehensions, naming, pyupgrade. We deliberately stay narrow in P1; P2
# ramps up to a stricter set (including E402, B905, UP042) after the
# architecture refactor moves the sys.path hacks and StrEnum upgrades.
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "N"]
ignore = [
    "E501",   # line length is enforced by black/formatter, not lint
    "E402",   # module-level imports after sys.path hacks: removed in P2 (real package layout)
    "E741",   # ambiguous one-letter names (l, I) -- accepted in actuarial code
    "N802",   # function names sometimes use uppercase (e.g. _L, C cell helpers)
    "N803",   # actuarial code uses single-letter parameter names (q_x, t_rem, ...)
    "N806",   # same: in-function variables like L, DF are intentional
    "B007",   # loop control variable unused (parametrize-style loops)
    "B008",   # FastAPI/Streamlit-friendly default-arg pattern
    "B905",   # zip() without strict= -- broad change; revisit in P2
    "F841",   # unused local (a few intentional debug/snapshot vars; revisit in P2)
    "UP042",  # str+Enum should be StrEnum -- ProductType migration in P2
    # UP038 was removed in ruff 0.10 (it warned about `isinstance(x, X | Y)`).
    # We bumped to ruff 0.15 in 2026-04 -- keeping it in `ignore` produces a
    # "rules have been removed" warning, so it is dropped here. The legacy
    # tuple form is no longer flagged at all.
    "SIM108", # ternary often hurts readability for actuarial branches
    "SIM118", # `key in dict.keys()` -- benign style, revisit in P2
]

[tool.ruff.lint.per-file-ignores]
"src/annuity_model/pricing_run_form_state.py" = ["N801"]
"tests/**/*.py" = ["B", "N802", "N803", "N806", "C408"]
"scripts/**/*.py" = ["B"]
"src/annuity_model/illustrate_pricing_projection.py" = ["B"]
"src/annuity_model/test_dashboard.py" = ["SIM105"]

[tool.ruff.lint.isort]
known-first-party = [
    "annuity_model",
]

# [tool.black] removed 2026-04 -- ruff-format is the single formatter.
# Ruff inherits line-length / target-version from [tool.ruff] above.

[tool.mypy]
python_version = "3.11"
strict = false  # Default permissive; per-module overrides tighten the parity-critical core.
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "^\\.venv/",
    "^\\.smoke/",
    "^reports/",
    "^tests/",      # tests are exempt to keep the focus on the engine
]

# --- Strict-mode core: the parity-critical surface area ---
# Mypy is run strict on these modules in pre-commit and CI.
#
# We split the strict surface into two override blocks so the lists stay
# self-documenting:
#
#   1. Hand-curated load-bearing core modules. These are the legacy flat
#      modules that the entire product platform pivots on (engines,
#      Excel-formula generators, validators, registries). Adding a new
#      module here is a load-bearing decision.
#
#   2. A glob over `products.*.engine` (and `products.*.excel`). The new
#      products subpackage layout (`annuity_model/products/<name>/...`)
#      means any new product gets strict-mode coverage automatically as
#      soon as it lands its `engine.py` shim -- no second commit to
#      pyproject.toml required. tests/test_mypy_strict_glob.py asserts
#      the glob actually covers every implemented product.
#
# Historical notes:
#   `pricing_projection` was restored to strict in 2026-04 (Wave 2.1) by adding
#   TypeGuard narrowing on `_is_numeric`, an explicit Mortality union annotation,
#   replacing pd.io.common.file_exists with os.path.exists, and float-narrowing
#   the np.flatnonzero loop index. `alm_excel_ladder` was restored to strict in
#   2026-04 (Wave 2.2) by introducing typed `Ci()`/`Cl()` accessors that narrow
#   the `int | list[int]` union returned by the internal `C()` column registry,
#   annotating the `ws: Worksheet` parameter, and replacing inline `lambda i, d=di`
#   closures with named factory helpers so mypy can infer the parameter type.
[[tool.mypy.overrides]]
module = [
    # --- Calculation engines (Python source-of-truth) ---
    "annuity_model.pricing_projection",
    "annuity_model.term_projection",
    "annuity_model.rila_projection",
    # --- Excel formula generation + workbook builders ---
    "annuity_model.alm_excel_ladder",
    "annuity_model.build_pricing_excel_workbook",
    "annuity_model.build_term_excel_workbook",
    "annuity_model.build_rila_excel_workbook",
    "annuity_model.excel_builder_helpers",
    "annuity_model.excel_workbook_validator",
    # --- Product registries + dispatch ---
    "annuity_model.product_registry",
    "annuity_model.product_excel",
    "annuity_model.liability_dispatch",
    "annuity_model.liability_layouts",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unreachable = true
no_implicit_reexport = true

# Glob pattern: every per-product subpackage module is strict by construction.
# `products.*.engine` matches `products.spia.engine`, `products.term.engine`,
# `products.rila.engine`, and any future `products.<new>.engine` automatically.
# Same for the Excel-builder shims under `.excel`. The shims are currently
# thin re-exports, so the strict mode mostly enforces import discipline -- but
# once the engines physically migrate into these files (P5 Wave 3.3) the same
# pattern keeps them strict without further pyproject churn.
[[tool.mypy.overrides]]
module = [
    "annuity_model.products",
    "annuity_model.products.*",
    "annuity_model.products.*.engine",
    "annuity_model.products.*.excel",
    "annuity_model.products.*.schema",
    "annuity_model.products.*.ui",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unreachable = true
no_implicit_reexport = true

# [tool.pytest.ini_options] removed 2026-04 -- pytest.ini is the single source
# of truth at runtime. Pytest reads pytest.ini *first* and ignores pyproject's
# [tool.pytest.ini_options] when both exist, so this section was silently dead
# and only created a drift hazard (e.g. the markers list here had fallen behind
# pytest.ini, missing the `invariant` and `property` markers). The src/ layout
# move (P3) will switch to pyproject as the canonical location and delete
# pytest.ini in the same commit.

[tool.coverage.run]
branch = true
source = ["src/annuity_model"]
omit = [
    ".venv/*",
    ".smoke/*",
    "tests/*",
    "scripts/*",
    "reports/*",
    "src/annuity_model/illustrate_pricing_projection.py",
    "src/annuity_model/generate_sp500_scenario_csv.py",
    "src/annuity_model/test_dashboard.py",
]
parallel = false

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@overload",
]
# RATCHET FLOOR -- single source of truth for the coverage gate.
#
# `scripts/ratchet_coverage.py` reads this value, runs the test-derived
# `coverage report --format=total`, and fails if the actual percentage drops
# below `fail_under`. CI invokes the script instead of passing a literal
# `--fail-under` so the gate cannot drift between this file and the workflow.
#
# Bumping the floor is a deliberate, reviewer-gated act:
#   * Run `python scripts/ratchet_coverage.py --update` locally.
#   * Commit the resulting `fail_under = X` change in the same PR as the new
#     tests that justify it. The script will refuse to lower the floor; only
#     manual edits can do that, and CODEOWNERS protects this file.
#
# History: started at 55.0 (covered ~59.6% headline, dominated by
# pricing_ui.py uncovered Streamlit code). The ratchet is one-way upward to
# prevent silent regressions when new code lands without tests.
fail_under = 55.0
