[pytest]
pythonpath = .
testpaths = tests
addopts =
    -ra
    --strict-markers
    --strict-config
markers =
    regression: marks tests as regression tests for historical bugs (deselect with '-m "not regression"')
    parity: marks parity tests for Python-vs-Excel reconciliation
    product_spia: marks tests that validate SPIA product behavior
    product_term: marks tests that validate Term Life product behavior
    product_rila: marks tests that validate RILA product behavior
    product_myga: marks tests that validate MYGA product behavior
    product_fia: marks tests that validate FIA product behavior
    product_va: marks tests that validate Variable Annuity product behavior
    product_wl: marks tests that validate Whole Life product behavior
    product_ul: marks tests that validate Universal Life product behavior
    product_iul: marks tests that validate Indexed UL product behavior
    product_vul: marks tests that validate Variable UL product behavior
    slow: marks tests that take >0.3s; deselect with '-m "not slow"'
    invariant: marks structural / AST invariant tests
    property: marks Hypothesis property-based tests
    ui: marks Streamlit AppTest UI smoke tests (slower; full app render)
    sme_smoke: marks the Actuary SME lite golden regression (always-on, <30s)
    integration: marks CLI / subprocess integration tests
    excel_recalc_candidate: marks advisory tests for experimental workbook recalc backends
    external_excel: marks tests that require an external spreadsheet application or service
