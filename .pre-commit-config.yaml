# Pre-commit hooks for Code_Sandbox.
#
# Install once per clone:    pre-commit install
# Run on the whole tree:     pre-commit run --all-files
#
# CI runs the same hooks via .github/workflows/ci.yml so local and remote
# never diverge.

default_language_version:
  # `python3` (not `python3.11`) so pre-commit will use whatever Python 3.x the
  # caller / CI runner has. The actual *target* Python is fixed by:
  #   - tool.ruff.target-version (py311) in annuity_model/pyproject.toml
  #   - tool.black.target-version in annuity_model/pyproject.toml
  #   - tool.mypy.python_version (3.11) in annuity_model/pyproject.toml
  # so changing this to a wildcard does not relax what the hooks actually check.
  # Pinning to python3.11 was breaking CI because actions/setup-python only
  # provisions the matrix entry's interpreter (3.12 for the pre-commit job).
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
        # mkdocs.yml uses python-name tags (!!python/name:...) for pymdownx
        # superfences; `check-yaml` (safe loader) cannot parse those.
        exclude: ^annuity_model/mkdocs\.yml$
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: end-of-file-fixer
        exclude: ^(.*\.xlsx|.*\.csv)$
      - id: trailing-whitespace
        exclude: ^(.*\.xlsx|.*\.csv)$
      - id: mixed-line-ending
        args: ["--fix=lf"]
        exclude: ^.*\.bat$  # Windows launchers stay CRLF per .gitattributes

  # Single formatter: ruff-format. Black was previously listed too, but the
  # two reformatters disagreed on assert-with-paren wrapping (black 25.1.0
  # vs ruff-format 0.8.x), making `pre-commit run --all-files` non-idempotent
  # and causing CI to fail with "files were modified by this hook" on every
  # push. Ruff-format produces black-compatible output by design, so dropping
  # black removes the conflict, eliminates the maintenance burden of two
  # near-identical pins (black==25.1.0 + ruff==0.8.4), and obviates the
  # dependabot black-major-bump PR.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      # ruff-pre-commit 0.15 renamed the lint hook from `ruff` to `ruff-check`
      # (the old id still works but prints a "legacy alias" warning).
      - id: ruff-check
        args: ["--fix"]
        files: ^annuity_model/.*\.py$
      - id: ruff-format
        files: ^annuity_model/.*\.py$

  # Mypy is run strict on the parity-critical core only (per pyproject.toml
  # overrides). Adding a new product engine? Add its module to the override
  # list there too.
  #
  # NB: `rev` matches the version pinned in annuity_model/requirements-dev.txt
  # (mypy==1.20.1). Pre-commit's mirrors-mypy uses `vX.Y.Z` tags. Bump both
  # together so local pre-commit and CI use the exact same checker.
  #
  # `pricing_projection` was restored to strict in P5 Wave 2.1 (2026-04) and
  # `alm_excel_ladder` was restored in P5 Wave 2.2 (2026-04). See
  # pyproject.toml `[[tool.mypy.overrides]]` for the matching rationale
  # comment (TypeGuard narrowing, typed Ci()/Cl() column accessors, etc.).
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.20.1
    hooks:
      - id: mypy
        name: mypy (parity-critical core)
        # Match (1) the load-bearing package modules and (2) every per-product
        # subpackage shim under annuity_model/src/annuity_model/products/<name>/.
        # The actual
        # strict-mode rules live in annuity_model/pyproject.toml under the
        # `[[tool.mypy.overrides]]` blocks (one for hand-curated core, one
        # for the products.*.<submodule> glob). Adding a new product no
        # longer requires editing this regex -- the products/*/*.py branch
        # picks it up automatically. tests/test_mypy_strict_glob.py keeps
        # the two halves in sync.
        files: |
          (?x)^annuity_model/(
              src/annuity_model/(pricing_projection
               |term_projection
               |rila_projection
               |alm_excel_ladder
               |build_pricing_excel_workbook
               |build_term_excel_workbook
               |build_rila_excel_workbook
               |excel_builder_helpers
               |excel_workbook_validator
               |product_registry
               |product_excel
               |liability_dispatch
               |liability_layouts)\.py
              |src/annuity_model/products/[^/]+/(engine|excel|schema|ui|__init__)\.py
          )$
        args:
          - "--config-file=annuity_model/pyproject.toml"
          - "--follow-imports=silent"
        additional_dependencies:
          - numpy>=2.0
          - pandas-stubs
          - types-openpyxl

  # Custom local hooks. Cheap import smoke + validator import smoke catch the
  # most embarrassing breakage classes (typo in a module-level import) before
  # the slower test suite even runs.
  # Local hooks. These pick `./annuity_model/.venv/bin/python` if the dev
  # bootstrap has been run, else fall back to `python3` (which is python3.12
  # on CI runners via actions/setup-python). The codebase uses
  # `dataclass(slots=True)` -- Python 3.10+ -- so we MUST NOT bind these to
  # macOS's system `python3` (3.9). Same defence as the launcher
  # (docs/runbooks/launcher_double_click.md).
  - repo: local
    hooks:
      - id: import-smoke-validator
        name: import smoke - excel_workbook_validator
        entry: bash -c 'PY="./annuity_model/.venv/bin/python"; [ -x "$PY" ] || PY="python3"; "$PY" -c "import sys; sys.path.insert(0, \"annuity_model/src\"); from annuity_model.excel_workbook_validator import validate_workbook_or_raise"'
        language: system
        pass_filenames: false
        files: ^annuity_model/src/annuity_model/excel_workbook_validator\.py$

      - id: import-smoke-engines
        name: import smoke - engines
        entry: bash -c 'PY="./annuity_model/.venv/bin/python"; [ -x "$PY" ] || PY="python3"; "$PY" -c "import sys; sys.path.insert(0, \"annuity_model/src\"); import annuity_model.pricing_projection, annuity_model.term_projection, annuity_model.rila_projection, annuity_model.product_registry, annuity_model.product_excel"'
        language: system
        pass_filenames: false
        files: ^annuity_model/src/annuity_model/(pricing_projection|term_projection|rila_projection|product_registry|product_excel|build_.*_excel_workbook|alm_excel_ladder|recalc_excel_shared)\.py$

      - id: render-parity-contract-check
        name: parity-contract docs in sync with parity_constants.py
        entry: bash -c 'PY="./annuity_model/.venv/bin/python"; [ -x "$PY" ] || PY="python3"; "$PY" annuity_model/scripts/render_parity_contract.py --check'
        language: system
        pass_filenames: false
        files: ^annuity_model/(src/annuity_model/parity_constants\.py|scripts/render_parity_contract\.py|docs/(model|rila)_parity_contract\.md)$

      # Locks the launcher contract: anyone touching pyproject.toml or one of
      # the launchers gets the launcher invariants test re-run before commit.
      # This is what would have caught the dataclass(slots=True) / Python 3.9
      # incident at commit time.
      - id: launcher-invariants
        name: launcher invariants (pyproject + run_pricing_ui.{sh,bat,command})
        # Same .venv-prefer-with-python3-fallback pattern as the other local
        # hooks, so this works on (a) the CI pre-commit job which has no
        # ./annuity_model/.venv and (b) macOS dev where the venv is required.
        entry: bash -c 'cd annuity_model && PY="./.venv/bin/python"; [ -x "$PY" ] || PY="python3"; "$PY" -m pytest tests/test_launcher_invariants.py -q'
        language: system
        pass_filenames: false
        files: ^(annuity_model/(pyproject\.toml|run_pricing_ui\.(sh|command|bat)|run_test_dashboard\.(sh|bat)|src/annuity_model/launchers\.py|tests/test_launcher_invariants\.py))$

      - id: documentation-map-inventory
        name: docs inventory map is in sync
        entry: bash -c 'PY="./annuity_model/.venv/bin/python"; [ -x "$PY" ] || PY="python3"; "$PY" annuity_model/scripts/check_documentation_map.py'
        language: system
        pass_filenames: false
        files: ^(DOCUMENTATION_MAP\.md|.*\.md|annuity_model/scripts/check_documentation_map\.py|annuity_model/tests/test_documentation_map\.py)$

      - id: unit-test-discipline-guard
        name: behavior changes require test updates
        entry: bash -c 'PY="./annuity_model/.venv/bin/python"; [ -x "$PY" ] || PY="python3"; "$PY" annuity_model/scripts/check_test_update_required.py'
        language: system
        pass_filenames: false
        files: ^annuity_model/.*\.py$

      - id: team-run-packet-evidence
        name: broad/high-risk changes require Team Run Packet evidence
        entry: bash -c 'PY="./annuity_model/.venv/bin/python"; [ -x "$PY" ] || PY="python3"; "$PY" annuity_model/scripts/check_team_run_packet_evidence.py --staged'
        language: system
        pass_filenames: false
        files: ^(annuity_model/.*|\.github/.*|AGENTS\.md|DOCUMENTATION_MAP\.md|PROJECT_DEVELOPMENT_GUIDE\.md)$
